# Starter domain → Category map. Bundled with familymon for phase 1; will be
# augmented by nightly rebuild from Toulouse + v2fly/domain-list-community in
# phase 3 once URL extraction (DNS + AT-SPI) is wired.
#
# Match rules:
#   - exact domain match, OR
#   - any apex of the observed domain (e.g. observed `m.youtube.com` matches
#     entry `youtube.com` because youtube.com is an apex of m.youtube.com).
#
# First matching category wins, in file order (top-down).

