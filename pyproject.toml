[project]
name = "familymon"
version = "0.0.1"
description = "Local-first parental-control monitoring for Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Oleksandr Srv" }]
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "dbus-next>=0.2.3",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
analyze = [
    "imagehash>=4.3",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
    "httpx>=0.27",
    "scikit-learn>=1.4",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
familymonctl = "familymon.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["familymon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
